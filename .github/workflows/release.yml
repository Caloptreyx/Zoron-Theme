name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: Caloptreyx/.github/.github/workflows/extension-check.yml@main

  # the oldest panel Metadata.toml allows, with lint off and warnings allowed (check.yml says why)
  floor:
    uses: Caloptreyx/.github/.github/workflows/extension-check.yml@main
    with:
      panel-ref: release-1.2.2
      lint: false
      build-warnings: warn

  release:
    needs: [check, floor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches backend/Cargo.toml
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/Cargo.toml", "rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match version ${version} in backend/Cargo.toml (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: python3 scripts/package.py

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "Zoron Theme ${VERSION}" --generate-notes
          fi
          gh release upload "${TAG}" dist/dev_caloptreyx_zoron.c7s.zip --clobber
