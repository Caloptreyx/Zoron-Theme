name: Release

# A pushed `v*` tag is checked, its GitHub release created, and a real `panel-rs extensions export` of the tag
# attached to it (Caloptreyx/.github extension-release.yml). "Run workflow" with a tag rebuilds an existing release's
# zip without the checks.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to export and upload to, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    uses: Caloptreyx/.github/.github/workflows/extension-check.yml@main

  # the oldest panel Metadata.toml allows, with lint off and warnings allowed (check.yml says why)
  floor:
    if: github.event_name == 'push'
    uses: Caloptreyx/.github/.github/workflows/extension-check.yml@main
    with:
      panel-ref: release-1.2.2
      lint: false
      build-warnings: warn

  publish:
    needs: [check, floor]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches backend/Cargo.toml
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/Cargo.toml", "rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match version ${version} in backend/Cargo.toml (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "Zoron Theme ${VERSION}" --generate-notes
          fi

  export:
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    uses: Caloptreyx/.github/.github/workflows/extension-release.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
